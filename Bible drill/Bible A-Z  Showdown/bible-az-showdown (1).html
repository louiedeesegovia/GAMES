<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bible A–Z Showdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#004aad;--navy:#000554;--red:#ff3131;--yellow:#ffde59;--green:#00b95c;--ok:#16d070;--ui:'Fredoka','Trebuchet MS',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#00255a;overflow:hidden;font-family:'Bangers',Impact,'Arial Narrow',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--blue);transform-origin:center center;overflow:hidden;letter-spacing:1px}
.box{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:20px}
.navy{background:var(--navy)}.black{background:#000}
.tn{font-size:68px;line-height:.95;display:block}
.tsm{font-size:26px;display:block;color:#9fb4ff;letter-spacing:2px}
.time{font-size:80px;transition:box-shadow .2s}
.turn{box-shadow:0 0 0 7px var(--yellow),0 0 34px 6px rgba(255,222,89,.55)}
.time.low{color:#ff7b7b;animation:blink .5s infinite alternate}
#roundname{font-size:64px}
/* letter row */
.tile{position:absolute;top:196px;width:115px;height:115px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:78px;line-height:1;transition:transform .2s,background .25s,opacity .25s}
.tile.navy{background:var(--navy)}.tile.red{background:var(--red)}
.tile.correct{background:var(--ok)}
.tile.wrong{background:#3b3b3b;color:#8a8a8a;text-decoration:line-through;text-decoration-thickness:6px}
.tile.timeout{background:#27406f;color:#7188b3}
.tile.passed{box-shadow:inset 0 -12px 0 var(--yellow)}
.tile.cur{outline:5px dashed rgba(255,255,255,.55);outline-offset:3px}
.tile.cur.act{outline:6px solid #fff;transform:scale(1.1);animation:pulse .8s infinite alternate}
/* big letters */
.big{position:absolute;width:382px;height:313px;top:369px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:330px;line-height:1;transition:opacity .25s,box-shadow .25s,transform .25s}
.big.navy{left:43px}.big.red{left:1488px;background:var(--red)}
.big.dim{opacity:.45}
.big.act{box-shadow:0 0 0 8px #fff,0 0 40px 8px rgba(255,255,255,.35)}
.big.shake{animation:shake .5s}
.tag{position:absolute;top:12px;left:0;right:0;font-style:normal;font-size:34px;color:var(--yellow);letter-spacing:3px}
.ans{position:absolute;top:688px;width:382px;height:124px;background:#fff;color:#000;border:8px solid #000;border-radius:22px;display:flex;align-items:center;justify-content:center;font-family:var(--ui);font-weight:700;text-align:center;padding:6px 14px;overflow:hidden;transition:background .2s}
.ans.l{left:43px}.ans.r{left:1488px}
.ans.ok{background:#bdf7d4}.ans.bad{background:#ffc6c6}
.fit{display:block;max-width:100%;line-height:1.1}
/* clues */
.label{left:528px;width:255px;height:125px;font-size:52px;color:#fff}
.clue{left:825px;width:555px;height:125px;background:#fff;color:#000;border:8px solid #000;border-radius:22px;font-family:var(--ui);font-weight:600;padding:4px 20px;overflow:hidden}
.clue .fit{opacity:0}
.clue.show .fit{opacity:1;animation:pop .35s}
/* buttons */
.btn{position:absolute;top:868px;height:126px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:62px;cursor:pointer;transition:filter .15s,transform .08s,opacity .2s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(4px)}
.btn.off{opacity:.35;pointer-events:none}
#bClue{left:459px;width:365px;background:#000}
#bPass{left:941px;width:155px;background:var(--yellow);color:#000}
#bAns{left:1213px;width:418px;background:var(--green)}
#bOk{left:459px;width:570px;background:var(--green)}
#bBad{left:1061px;width:570px;background:var(--red)}
.hide{display:none!important}
#status{position:absolute;left:459px;width:1172px;top:822px;height:40px;text-align:center;font-family:var(--ui);font-weight:600;font-size:30px;color:#dbe7ff;letter-spacing:.5px}
#hints{position:absolute;left:0;right:0;top:1022px;text-align:center;font-family:var(--ui);font-size:22px;color:rgba(255,255,255,.65)}
.mini{position:absolute;top:1018px;height:44px;padding:0 20px;border-radius:12px;background:rgba(0,0,0,.35);font-family:var(--ui);font-weight:600;font-size:22px;display:flex;align-items:center;cursor:pointer;letter-spacing:.5px}
.mini:hover{background:rgba(0,0,0,.55)}
/* overlay */
#overlay{position:absolute;inset:0;background:rgba(0,10,45,.86);display:flex;align-items:center;justify-content:center;z-index:20}
#overlay canvas{position:absolute;inset:0;pointer-events:none}
.card{position:relative;max-width:1500px;text-align:center;padding:30px 50px}
.card h1{font-size:128px;line-height:.95;color:var(--yellow);text-shadow:0 8px 0 #000}
.card h2{font-size:110px;line-height:1;margin-bottom:6px}
.card .sub{font-family:var(--ui);font-weight:600;font-size:36px;color:#cfe0ff;margin:14px 0 26px}
.opts{display:flex;gap:46px;justify-content:center;margin:10px 0 24px}
.opt label{display:block;font-size:34px;color:var(--yellow);margin-bottom:8px;letter-spacing:2px}
.seg{display:flex;gap:8px;justify-content:center}
.seg button{font-family:'Bangers',Impact,sans-serif;letter-spacing:1px;font-size:36px;padding:6px 24px;border-radius:14px;border:4px solid #000;background:var(--navy);color:#fff;cursor:pointer}
.seg button.on{background:var(--yellow);color:#000}
.rules{font-family:var(--ui);font-weight:500;font-size:28px;line-height:1.35;color:#dbe7ff;text-align:left;max-width:1180px;margin:0 auto 26px;padding-left:34px}
.pbtn{font-family:'Bangers',Impact,sans-serif;letter-spacing:2px;font-size:76px;padding:6px 64px;border-radius:24px;border:0;background:var(--green);color:#fff;cursor:pointer;box-shadow:0 8px 0 #006e36}
.pbtn:hover{filter:brightness(1.1)}.pbtn:active{transform:translateY(5px);box-shadow:0 3px 0 #006e36}
.pbtn.alt{background:#555;box-shadow:0 8px 0 #222;margin-left:20px}
table.sum{margin:10px auto 24px;border-collapse:separate;border-spacing:14px 10px;font-size:44px}
table.sum th{color:var(--yellow);font-weight:400;font-size:40px}
table.sum td{padding:6px 26px;border-radius:14px;background:rgba(0,0,0,.35)}
table.sum td.g1{background:var(--navy)}table.sum td.g2{background:var(--red)}
.winner{font-size:120px;color:var(--yellow);text-shadow:0 7px 0 #000;margin:6px 0}
.pop{position:absolute;z-index:10;font-size:150px;color:var(--yellow);text-shadow:0 6px 0 #000,0 0 30px #000;pointer-events:none;animation:floatup 1.3s ease-out forwards}
.pop.bad{color:#fff;text-shadow:0 6px 0 var(--red),0 0 30px #000}
.tile.empty{opacity:.22}
.gmstatus{font-family:var(--ui);font-weight:600;font-size:30px;color:#9fe8b5;margin:0 0 22px}
.gmstatus.bad{color:#ffb3b3}
.pbtn.gmbtn{background:var(--yellow);color:#000;box-shadow:0 8px 0 #a58a1b;margin-left:24px}
/* ---- Game Master page ---- */
#gm{position:absolute;inset:0;z-index:30;background:var(--blue);padding:24px 44px;overflow:hidden;font-family:var(--ui);color:#fff;letter-spacing:0}
#gm.hide{display:none}
.gm-head{display:flex;justify-content:space-between;align-items:center;height:84px}
.gm-head h2{font-family:'Bangers',Impact,sans-serif;font-size:80px;letter-spacing:2px;color:var(--yellow);text-shadow:0 5px 0 #000}
.gm-actions{display:flex;gap:12px}
.gbtn{font-family:'Bangers',Impact,sans-serif;letter-spacing:1px;font-size:32px;padding:6px 22px;border:4px solid #000;border-radius:14px;background:var(--navy);color:#fff;cursor:pointer}
.gbtn:hover{filter:brightness(1.2)}.gbtn.red{background:var(--red)}.gbtn.green{background:var(--green)}
.gm-tabs{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.gtab{font-family:'Bangers',Impact,sans-serif;font-size:30px;letter-spacing:1px;padding:4px 20px;border-radius:14px;background:var(--navy);cursor:pointer;display:flex;align-items:center;gap:10px;border:4px solid transparent}
.gtab.on{background:#000;border-color:var(--yellow)}.gtab.off{opacity:.45}.gtab.add{background:rgba(0,0,0,.35)}
.dot{width:16px;height:16px;border-radius:50%;background:#555;display:inline-block}
.dot.part{background:var(--yellow)}.dot.full{background:var(--ok)}
.gm-set{display:flex;align-items:flex-end;gap:26px;margin-bottom:14px}
.gm-set label{display:flex;flex-direction:column;font-family:'Bangers',Impact,sans-serif;font-size:24px;letter-spacing:2px;color:var(--yellow);gap:4px}
.gm-set label.chk{flex-direction:row;align-items:center;gap:10px;padding-bottom:12px}
#gm input:not([type=checkbox]),#gm textarea{font-family:var(--ui);font-weight:600;font-size:24px;padding:8px 12px;border:4px solid #000;border-radius:12px;background:#fff;color:#000;outline:none;width:100%}
#gm input:focus,#gm textarea:focus{border-color:var(--yellow)}
#gm input[type=checkbox]{width:30px;height:30px;accent-color:var(--green)}
#gName{width:340px}
.teamtabs{display:flex;gap:10px;margin-left:auto}
.tt{font-family:'Bangers',Impact,sans-serif;font-size:38px;padding:4px 26px;border-radius:14px;cursor:pointer;border:4px solid transparent;opacity:.6}
.tt.g1{background:var(--navy)}.tt.g2{background:var(--red)}.tt.on{opacity:1;border-color:#fff}
.gm-grid{display:grid;grid-template-columns:100px 270px 1fr 1fr 1fr 90px;gap:12px;align-items:stretch}
.gm-cols{font-family:'Bangers',Impact,sans-serif;font-size:26px;letter-spacing:2px;color:var(--yellow);margin-bottom:6px}
.gm-row{margin-bottom:12px}
.gm-row .lt{border-radius:16px;font-family:'Bangers',Impact,sans-serif;font-size:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.gm-row.g1 .lt{background:var(--navy)}.gm-row.g2 .lt{background:var(--red)}
.gm-row.empty .lt{opacity:.5}
.gm-row .warn{font-family:var(--ui);font-size:14px;font-weight:600;color:var(--yellow);min-height:16px;text-align:center;letter-spacing:0}
.gm-row textarea{resize:none;height:92px;font-size:22px;line-height:1.2}
.gm-row .ia{height:92px;font-size:28px}
.gm-row .cx{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);border-radius:12px}
.gm-foot{font-size:20px;color:rgba(255,255,255,.75);line-height:1.35;margin-top:4px}
@keyframes pulse{to{transform:scale(1.18)}}
@keyframes blink{to{opacity:.55}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-18px)}40%{transform:translateX(16px)}60%{transform:translateX(-12px)}80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes floatup{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1.1)}100%{transform:translateY(-190px) scale(1);opacity:0}}
</style>
</head>

<div id="stage">
  <!-- top bar -->
  <div class="box navy" id="n0" style="left:158px;top:45px;width:115px;height:125px"><div><span class="tn">G1</span><span class="tsm" id="sc0">0 PTS</span></div></div>

  <div id="tiles"></div>

  <!-- team letters + answers -->
  <div class="big navy" id="big0"><span id="bt0">A</span><em class="tag" id="tag0"></em></div>

  <div class="ans r" id="ans1"><span class="fit"></span></div>

  <!-- clues -->
  <div class="box black label" style="top:369px">CLUE #1</div>
  <div class="box clue" id="c0" style="top:369px"><span class="fit"></span></div>

  <div id="hints">SPACE pause &nbsp;·&nbsp; C clue &nbsp;·&nbsp; P pass &nbsp;·&nbsp; A answer &nbsp;·&nbsp; Y correct &nbsp;·&nbsp; N wrong</div>

  <div id="gm" class="hide"></div>
  <div id="overlay" class="hide"><canvas id="confetti" width="1920" height="1080"></canvas><div class="card" id="card"></div></div>
</div>

const LS_KEY='bible-az-showdown.bank.v1';
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const blankPrompt=()=>({a:'',c:['','',''],x:false});
function normLetters(s,start){let L=(s||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,6);let n=L.length?ALPHA.indexOf(L[L.length-1])+1:(start||0);while(L.length<6){L+=ALPHA[n%26];n++}return L}
function blankRound(name,start){return{name,on:true,letters:normLetters('',start),g1:Array.from({length:6},blankPrompt),g2:Array.from({length:6},blankPrompt)}}
function defaultBank(){return[blankRound('TRIAL ROUND',0),...[1,2,3,4,5].map((n,i)=>blankRound('ROUND '+n,6+i*6))]}
const toP=p=>({a:p[0],c:[p[1]||'',p[2]||'',p[3]||''],x:!!p[4]});
function sampleBank(){return DATA.map(r=>({name:r.name,on:true,letters:r.letters,g1:r.g1.map(toP),g2:r.g2.map(toP)}))}
function sanitizeBank(arr){if(!Array.isArray(arr)||!arr.length)return null;
 const fix=list=>Array.from({length:6},(_,j)=>{const p=(list&&list[j])||{};const c=Array.isArray(p.c)?p.c:[];return{a:String(p.a||''),c:[0,1,2].map(n=>String(c[n]||'')),x:!!p.x}});
 return arr.slice(0,20).map((r,i)=>({name:String(r.name||('ROUND '+(i+1))).slice(0,24),on:r.on!==false,letters:normLetters(String(r.letters||''),i*6),g1:fix(r.g1),g2:fix(r.g2)}))}
function loadBank(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const b=sanitizeBank(JSON.parse(raw));if(b)return b}}catch(e){}return defaultBank()}
function saveBank(){try{localStorage.setItem(LS_KEY,JSON.stringify(BANK))}catch(e){}}

/* ---------- helpers ---------- */

function fit(box,max,min=16){const s=box.querySelector('.fit')||box;if(!s.textContent.trim())return;let z=max;s.style.fontSize=z+'px';
 const cs=getComputedStyle(box);const aw=box.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const ah=box.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
 while((s.scrollHeight>ah||s.scrollWidth>aw+1)&&z>min){z-=1;s.style.fontSize=z+'px'}}
const cur=k=>{const t=S.teams[k];return t&&t.cur>=0?t.tiles[t.cur]:null};

function nextPending(k){const t=S.teams[k],n=t.tiles.length;for(let i=1;i<=n;i++){const j=(t.cur+i)%n;if(t.tiles[j].state==='pending')return j}return -1}

  tiles:(k?d.g2:d.g1).map((p,i)=>{const a=p.a.trim();return{letter:d.letters[i],ans:a,clues:p.c.map(s=>s.trim()),contains:p.x?d.letters[i]:'',state:a?'pending':'empty',passed:false,rev:0,shown:false}})}));
 S.teams.forEach(t=>{t.cur=t.tiles.findIndex(x=>x.state==='pending')});
 S.turn=S.played%2;if(!active(S.turn))S.turn=1-S.turn;S.phase='intro';S.paused=false;
 buildTiles();render();

/* ---------- render ---------- */
function render(){
 const d=S.rounds[S.ri]||DATA[0];
 $('roundname').firstElementChild.textContent=S.phase==='menu'?'BIBLE A–Z':d.name;fit($('roundname'),64,30);

 for(let k=0;k<2;k++){
  const t=S.teams[k];if(!t)continue;
  $('sc'+k).textContent=(S.total[k]+t.score-(0))+' PTS';
 }
 // note: totals only update at round end; show running = prior totals + this round
 for(let k=0;k<2;k++){const t=S.teams[k];if(!t)continue;
  $('sc'+k).textContent=(S.total[k]+t.score)+' PTS';
  const el=$('t'+k);el.textContent=fmt(t.time);
  el.classList.toggle('turn',playing&&S.turn===k);

   e.textContent=x.letter;
   e.className='tile '+(k?'red':'navy')+' '+(x.state!=='pending'?x.state:'')+(x.passed&&x.state==='pending'?' passed':'')+(i===t.cur&&x.state==='pending'&&S.phase!=='menu'?' cur':'')+(i===t.cur&&x.state==='pending'&&playing&&S.turn===k?' act':'');
  });

  $('big'+k).classList.toggle('act',playing&&S.turn===k);
  const a=$('ans'+k),sp=a.firstElementChild;a.classList.remove('ok','bad');
  if(tile&&tile.shown){sp.textContent=tile.ans}

  else sp.textContent='';
  fit(a,46,16);
 }
 // clues
 const tile=playing?cur(S.turn):null;
 for(let i=0;i<3;i++){const c=$('c'+i),sp=c.firstElementChild;const show=!!tile&&tile.rev>i;
  const txt=show?(tile.clues[i]||'—'):'';if(sp.textContent!==txt){sp.textContent=txt;c.classList.remove('show');void c.offsetWidth}
  c.classList.toggle('show',show);if(show)fit(c,34,15)}

 $('bPause').textContent=S.paused?'▶ RESUME':'⏸ PAUSE';

 }

}
function renderTimers(){for(let k=0;k<2;k++){const t=S.teams[k];$('t'+k).textContent=fmt(t.time);$('t'+k).classList.toggle('low',S.turn===k&&t.time>0&&t.time<=10)}}

/* ---------- clock ---------- */
let lastT=performance.now();
setInterval(()=>{
 const n=performance.now(),dt=(n-lastT)/1000;lastT=n;
 if(S.phase!=='play'||S.paused)return;
 const t=S.teams[S.turn],b=Math.ceil(t.time);t.time=Math.max(0,t.time-dt);
 if(Math.ceil(t.time)!==b&&t.time>0&&t.time<=10)sfx.tick();

},100);
function timeUp(k){
 const t=S.teams[k];t.time=0;t.tiles.forEach(x=>{if(x.state==='pending'){x.state='timeout';t.missed++}});t.cur=-1;

/* ---------- actions ---------- */
function afterAction(){
 if(!active(0)&&!active(1)){endRound();return}
 if(!active(S.turn))S.turn=1-S.turn;
 const t=S.teams[S.turn];if(t.cur<0||t.tiles[t.cur].state!=='pending')t.cur=nextPending(S.turn);
 lastT=performance.now();render();
}
function doClue(){if(S.phase!=='play'||S.paused)return;const x=cur(S.turn);if(!x||x.rev>=3)return;x.rev++;sfx.clue();render()}
function doPass(){if(S.phase!=='play'||S.paused)return;const k=S.turn,t=S.teams[k],x=cur(k);if(!x)return;
 x.passed=true;x.shown=false;sfx.pass();
 t.cur=nextPending(k);
 if(active(1-k))S.turn=1-k;
 afterAction()}
function doAnswer(){if(S.phase!=='play'||S.paused)return;const x=cur(S.turn);if(!x)return;x.shown=true;S.phase='judge';sfx.reveal();render()}
function judge(ok){if(S.phase!=='judge')return;const k=S.turn,t=S.teams[k],x=cur(k);if(!x)return;
 x.shown=false;t.last={ans:x.ans,ok};
 if(ok){const p=pts(x);x.state='correct';t.score+=p;t.correct++;sfx.ok();popup(k,'+'+p)}
 else{x.state='wrong';t.wrong++;sfx.bad();popup(k,'✗',true);const b=$('big'+k);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
 t.cur=-1;t.cur=(()=>{const n=t.tiles.length;const base=t.tiles.indexOf(x);for(let i=1;i<=n;i++){const j=(base+i)%n;if(t.tiles[j].state==='pending')return j}return -1})();
 S.phase='play';
 if(!ok&&active(1-k))S.turn=1-k;
 afterAction()}
function popup(k,txt,bad){const p=document.createElement('div');p.className='pop'+(bad?' bad':'');p.textContent=txt;

}

 const ps=Array.from({length:180},()=>({x:Math.random()*1920,y:-Math.random()*900,vx:(Math.random()-.5)*4,vy:3+Math.random()*6,s:10+Math.random()*14,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[(Math.random()*cols.length)|0]}));

 (function loop(){g.clearRect(0,0,1920,1080);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y>1100){p.y=-20;p.x=Math.random()*1920}g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);g.restore()});conf.raf=requestAnimationFrame(loop)})()}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function updateGmStatus(){const el=$('gmStatus');if(!el)return;el.classList.remove('bad');
 const ready=BANK.filter(roundReady),q=ready.reduce((n,r)=>n+roundCounts(r)[0]+roundCounts(r)[1],0),part=ready.filter(r=>roundCounts(r).some(n=>n<6)).length;
 el.textContent=ready.length?`${ready.length} round${ready.length>1?'s':''} ready · ${q} questions`+(part?` · ${part} not full (empty letters are skipped)`:''):'No questions yet — open the Game Master page to add yours.';
 if(!ready.length)el.classList.add('bad')}
function openGM(){GS.r=Math.min(GS.r,BANK.length-1);GS.t=GS.t||0;gm.classList.remove('hide');renderGM()}
function closeGM(){gm.classList.add('hide');showMenu()}
const dotClass=r=>{const [a,b]=roundCounts(r);return 'dot'+(a===6&&b===6?' full':(a+b?' part':''))};
function renderGM(){
 const r=BANK[GS.r],team=GS.t?'g2':'g1',list=r[team],[c1,c2]=roundCounts(r);
 const tabs=BANK.map((x,i)=>`<div class="gtab${i===GS.r?' on':''}${x.on?'':' off'}" data-r="${i}">${esc(x.name)}<i class="${dotClass(x)}"></i></div>`).join('');
 const rows=list.map((p,i)=>`<div class="gm-grid gm-row ${team}" data-i="${i}"><div class="lt">${r.letters[i]}<small class="warn"></small></div>
  <input class="ia" data-f="a" value="${esc(p.a)}" placeholder="Answer" autocomplete="off">
  <textarea data-f="c0" placeholder="Clue #1">${esc(p.c[0])}</textarea><textarea data-f="c1" placeholder="Clue #2">${esc(p.c[1])}</textarea><textarea data-f="c2" placeholder="Clue #3">${esc(p.c[2])}</textarea>
  <label class="cx" title="Tick if the answer only CONTAINS this letter (for hard letters like X)"><input type="checkbox" data-f="x"${p.x?' checked':''}></label></div>`).join('');
 gm.innerHTML=`<div class="gm-head"><h2>GAME MASTER</h2><div class="gm-actions">
   <button class="gbtn" id="gSample">LOAD SAMPLE</button><button class="gbtn" id="gImport">IMPORT</button><button class="gbtn" id="gExport">EXPORT</button><button class="gbtn red" id="gClear">CLEAR ALL</button><button class="gbtn green" id="gDone">DONE ✓</button></div></div>
  <div class="gm-tabs">${tabs}<div class="gtab add" id="gAdd">＋ ROUND</div></div>
  <div class="gm-set">
   <label>ROUND NAME<input id="gName" maxlength="24" value="${esc(r.name)}" autocomplete="off"></label>
   <label>LETTERS (6)<input id="gLetters" maxlength="6" value="${r.letters}" style="width:210px;letter-spacing:6px;text-transform:uppercase" autocomplete="off"></label>
   <label class="chk"><input type="checkbox" id="gOn"${r.on?' checked':''}> INCLUDE IN GAME</label>
   <button class="gbtn red" id="gDel" style="margin-bottom:6px">DELETE ROUND</button>
   <div class="teamtabs"><div class="tt g1${GS.t?'':' on'}" data-t="0">G1 · <b id="cnt0">${c1}</b>/6</div><div class="tt g2${GS.t?' on':''}" data-t="1">G2 · <b id="cnt1">${c2}</b>/6</div></div>
  </div>
  <div class="gm-grid gm-cols"><span></span><span>ANSWER</span><span>CLUE #1 (hardest)</span><span>CLUE #2</span><span>CLUE #3 (easiest)</span><span>CONTAINS</span></div>
  ${rows}
  <div class="gm-foot">Each answer should start with its letter — or tick CONTAINS for tough letters like X. Clue #1 is the hardest, #3 the easiest. Empty rows are skipped in play. Everything saves automatically in this browser; use EXPORT to keep a backup file you can IMPORT later.</div>`;
 bindGM();
}
function bindGM(){
 const r=BANK[GS.r],team=GS.t?'g2':'g1',list=r[team];
 const check=row=>{const i=+row.dataset.i,p=list[i],a=p.a.trim(),L=r.letters[i],bad=a&&!p.x&&a[0].toUpperCase()!==L;
  row.querySelector('.warn').textContent=bad?`starts with ${a[0].toUpperCase()}`:'';row.classList.toggle('empty',!a)};
 const counts=()=>{const [a,b]=roundCounts(r);$('cnt0').textContent=a;$('cnt1').textContent=b;const d=gm.querySelector('.gtab.on .dot');if(d)d.className=dotClass(r)};
 gm.querySelectorAll('.gtab[data-r]').forEach(e=>e.onclick=()=>{GS.r=+e.dataset.r;renderGM()});
 gm.querySelectorAll('.tt').forEach(e=>e.onclick=()=>{GS.t=+e.dataset.t;renderGM()});
 $('gAdd').onclick=()=>{if(BANK.length>=20)return;BANK.push(blankRound('ROUND '+BANK.length,BANK.length*6));saveBank();GS.r=BANK.length-1;renderGM()};
 $('gName').oninput=e=>{r.name=e.target.value;saveBank();const t=gm.querySelector('.gtab.on');if(t)t.firstChild.textContent=r.name};
 $('gLetters').oninput=e=>{r.letters=normLetters(e.target.value,GS.r*6);saveBank();gm.querySelectorAll('.gm-row').forEach(row=>{row.querySelector('.lt').firstChild.textContent=r.letters[+row.dataset.i];check(row)})};
 $('gLetters').onchange=()=>renderGM();
 $('gOn').onchange=e=>{r.on=e.target.checked;saveBank();renderGM()};
 $('gDel').onclick=()=>{if(BANK.length<=1){alert('You need at least one round.');return}
  if(!confirm('Delete "'+r.name+'" and all its questions?'))return;BANK.splice(GS.r,1);GS.r=Math.max(0,GS.r-1);saveBank();renderGM()};
 gm.querySelectorAll('.gm-row').forEach(row=>{const p=list[+row.dataset.i];
  row.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;
   el.addEventListener(f==='x'?'change':'input',()=>{if(f==='a')p.a=el.value;else if(f==='x')p.x=el.checked;else p.c[+f[1]]=el.value;saveBank();check(row);counts()})});
  check(row)});
 $('gDone').onclick=closeGM;
 $('gSample').onclick=()=>{if(confirm('Replace everything with the sample Bible questions?')){BANK=sampleBank();saveBank();GS.r=0;renderGM()}};
 $('gClear').onclick=()=>{if(confirm('Erase ALL questions and start fresh?')){BANK=defaultBank();saveBank();GS.r=0;GS.t=0;renderGM()}};
 $('gExport').onclick=()=>{const blob=new Blob([JSON.stringify(BANK,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bible-az-questions.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
 $('gImport').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';
  f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();
   rd.onload=()=>{try{const b=sanitizeBank(JSON.parse(rd.result));if(!b)throw 0;BANK=b;saveBank();GS.r=0;renderGM()}catch(e){alert('That file is not a valid questions file.')}};rd.readAsText(file)};f.click()};
}

/* ---------- init ---------- */
showMenu();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.phase!=='menu')render();else{$('roundname').firstElementChild&&fit($('roundname'),64,30)}});
</script>
</body>
</html>
